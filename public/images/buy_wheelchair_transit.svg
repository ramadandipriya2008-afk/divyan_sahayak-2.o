<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bwtBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fffbeb"/><stop offset="100%" stop-color="#fef3c7"/></linearGradient>
    <linearGradient id="amberFrame" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#b45309"/></linearGradient>
    <filter id="bwtSh"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#78350f" flood-opacity="0.2"/></filter>
  </defs>
  <rect width="600" height="450" rx="20" fill="url(#bwtBg)"/>
  <circle cx="300" cy="225" r="150" fill="#ffffff" opacity="0.7"/>
  <g filter="url(#bwtSh)" transform="translate(90, 45)">
    <!-- Companion Handbrakes and Handles -->
    <path d="M 160 70 L 190 85 L 190 190" fill="none" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
    <rect x="145" y="65" width="28" height="14" rx="4" fill="#1e293b"/>
    <path d="M 165 85 L 180 92" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
    <!-- Foldable Backrest -->
    <rect x="185" y="95" width="16" height="110" rx="5" fill="#1e293b"/>
    <!-- Seat -->
    <rect x="185" y="195" width="115" height="18" rx="6" fill="#0f172a"/>
    <!-- Amber Frame Struts -->
    <path d="M 195 210 L 275 295" stroke="url(#amberFrame)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 275 210 L 205 295" stroke="url(#amberFrame)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 275 210 L 320 280 L 315 320" fill="none" stroke="url(#amberFrame)" stroke-width="12" stroke-linecap="round"/>
    <!-- Swing away footplate -->
    <rect x="295" y="315" width="40" height="9" rx="3" fill="#475569"/>
    <!-- Compact Transit Wheels (Front & Rear are both small 8-12 inch) -->
    <!-- Rear Caster 12" -->
    <circle cx="205" cy="295" r="42" fill="#1e293b"/><circle cx="205" cy="295" r="18" fill="#e2e8f0"/>
    <circle cx="205" cy="295" r="7" fill="#64748b"/>
    <!-- Front Caster 8" -->
    <circle cx="320" cy="305" r="28" fill="#1e293b"/><circle cx="320" cy="305" r="12" fill="#e2e8f0"/>
    <circle cx="320" cy="305" r="5" fill="#64748b"/>
  </g>
  <text x="300" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle" letter-spacing="1">COMPACT ATTENDANT TRANSIT WHEELCHAIR</text>
</svg>
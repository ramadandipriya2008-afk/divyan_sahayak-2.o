<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="rwmBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fafaf9"/><stop offset="100%" stop-color="#f5f5f4"/></linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f5f5f5"/><stop offset="50%" stop-color="#a8a29e"/><stop offset="100%" stop-color="#78716c"/></linearGradient>
    <filter id="rwmSh"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#44403c" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="600" height="450" rx="20" fill="url(#rwmBg)"/>
  <circle cx="300" cy="225" r="150" fill="#ffffff" opacity="0.8"/>
  <g filter="url(#rwmSh)" transform="translate(60, 45)">
    <!-- Handles -->
    <path d="M 170 85 L 195 95 L 195 190" fill="none" stroke="#78716c" stroke-width="12" stroke-linecap="round"/>
    <rect x="150" y="80" width="30" height="14" rx="4" fill="#292524"/>
    <!-- Black Vinyl Backrest -->
    <rect x="190" y="105" width="18" height="100" rx="5" fill="#1c1917"/>
    <!-- Seat -->
    <rect x="190" y="200" width="125" height="18" rx="5" fill="#292524"/>
    <!-- Chrome Steel Frame -->
    <path d="M 200 215 L 290 310" stroke="url(#chrome)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 290 215 L 210 310" stroke="url(#chrome)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 290 215 L 340 290 L 330 330" fill="none" stroke="url(#chrome)" stroke-width="12" stroke-linecap="round"/>
    <rect x="315" y="325" width="45" height="10" rx="3" fill="#44403c"/>
    <rect x="200" y="160" width="80" height="12" rx="4" fill="#44403c"/>
    <!-- Large Rear Wheel with dense spokes -->
    <circle cx="210" cy="250" r="95" fill="none" stroke="#292524" stroke-width="13"/>
    <circle cx="210" cy="250" r="82" fill="none" stroke="#a8a29e" stroke-width="5"/>
    <circle cx="210" cy="250" r="75" fill="none" stroke="#d6d3d1" stroke-width="4"/>
    <circle cx="210" cy="250" r="12" fill="#57534e"/>
    <g stroke="#a8a29e" stroke-width="1.8" opacity="0.6">
      <line x1="210" y1="160" x2="210" y2="340"/><line x1="120" y1="250" x2="300" y2="250"/>
      <line x1="145" y1="185" x2="275" y2="315"/><line x1="145" y1="315" x2="275" y2="185"/>
      <line x1="175" y1="165" x2="245" y2="335"/><line x1="175" y1="335" x2="245" y2="165"/>
    </g>
    <!-- Front Caster -->
    <circle cx="345" cy="330" r="22" fill="#292524"/>
    <circle cx="345" cy="330" r="9" fill="#d6d3d1"/>
  </g>
  <text x="300" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#44403c" text-anchor="middle" letter-spacing="1">PRE-OWNED CHROME MANUAL WHEELCHAIR</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbf5" />
      <stop offset="100%" stop-color="#fdf2e4" />
    </linearGradient>
    <linearGradient id="goldCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde8bb" />
      <stop offset="40%" stop-color="#e0b159" />
      <stop offset="100%" stop-color="#9c6d1d" />
    </linearGradient>
    <filter id="bteShadow">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#543806" flood-opacity="0.2" />
    </filter>
  </defs>
  <rect width="600" height="450" rx="20" fill="url(#bteBg)" />
  <circle cx="300" cy="225" r="150" fill="#ffffff" opacity="0.7" />

  <g filter="url(#bteShadow)">
    <!-- BTE Champagne Curved Housing -->
    <path d="M 260 100 C 340 90, 380 180, 340 270 C 315 320, 260 330, 230 300 C 205 270, 230 210, 250 170 C 265 140, 255 115, 260 100 Z" fill="url(#goldCase)" />
    <!-- Volume Push Buttons -->
    <circle cx="335" cy="185" r="5" fill="#5c400f" />
    <circle cx="325" cy="215" r="5" fill="#5c400f" />
    <!-- Dual Mic Inlets -->
    <rect x="275" y="105" width="8" height="4" rx="2" fill="#382506" />
    <rect x="305" y="118" width="8" height="4" rx="2" fill="#382506" />
    <!-- Sound Tube -->
    <path d="M 260 100 C 220 80, 150 120, 150 200 C 150 250, 180 270, 210 260" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.85" />
    <path d="M 260 100 C 220 80, 150 120, 150 200 C 150 250, 180 270, 210 260" fill="none" stroke="#e6c483" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <!-- Soft Silicone Mushroom Dome -->
    <path d="M 210 245 C 235 245, 240 275, 210 275 Z" fill="#ffffff" stroke="#cfa457" stroke-width="2" />
    <circle cx="215" cy="260" r="4" fill="#a17627" />
  </g>
  <text x="300" y="395" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#875908" text-anchor="middle" letter-spacing="1">REFURBISHED 12-CHANNEL BTE AID</text>
</svg>
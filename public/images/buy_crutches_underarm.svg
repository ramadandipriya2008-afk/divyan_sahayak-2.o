      <!-- Single Lower Leg -->
      <line x1="55" y1="240" x2="55" y2="345" stroke="url(#alumTube)" stroke-width="12" stroke-linecap="round"/>
      <!-- Push button holes -->
      <circle cx="55" cy="275" r="3" fill="#475569"/><circle cx="55" cy="295" r="3" fill="#475569"/><circle cx="55" cy="315" r="3" fill="#475569"/>

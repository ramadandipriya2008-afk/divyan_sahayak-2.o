  <text x="300" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#701a75" text-anchor="middle" letter-spacing="1">DUAL-STRUT AXILLARY UNDERARM CRUTCHES (PAIR)</text>

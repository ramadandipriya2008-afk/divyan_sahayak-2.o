    <linearGradient id="alumTube" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#e2e8f0"/><stop offset="50%" stop-color="#cbd5e1"/><stop offset="100%" stop-color="#94a3b8"/></linearGradient>
    <filter id="bcuSh"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#581c87" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="600" height="450" rx="20" fill="url(#bcuBg)"/>
